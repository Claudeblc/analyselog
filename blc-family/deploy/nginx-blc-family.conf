# Belcram Family — nginx (VPS). Un seul serveur Node (port 3100) sert tous les sous-domaines :
#   family.*  → accueil        galerie.* → galerie        chat.* → discussion        visio.* → appels vidéo
# Le HTTPS est ajouté ensuite par certbot (voir install.sh). La caméra/micro exigent HTTPS.
map $http_upgrade $blcf_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name family.blctv-player.com galerie.blctv-player.com chat.blctv-player.com visio.blctv-player.com
                family.blc-music-player.duckdns.org galerie.blc-music-player.duckdns.org chat.blc-music-player.duckdns.org visio.blc-music-player.duckdns.org;

    client_max_body_size 1g;          # vidéos familiales
    proxy_request_buffering off;      # téléversements en flux
    proxy_read_timeout 3600s;         # WebSocket longue durée

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $blcf_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
